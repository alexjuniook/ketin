<script>
class Player{
 constructor(x,y){this.x=x;this.y=y;this.w=42;this.h=34;this.vx=0;this.vy=0;this.face=1;this.grounded=false;this.coyote=0;this.buffer=0;this.jumpHold=0;this.lives=3;this.score=0;this.invuln=0;this.anim=0;this.squash=1;this.stretch=1;this.checkpointX=x;}
 update(input,parts){this.anim+=Math.abs(this.vx)*.08;if(this.grounded)this.coyote=CONFIG.COYOTE;else this.coyote=Math.max(0,this.coyote-1);this.buffer=Math.max(0,this.buffer-1);if(input.jumpPressed)this.buffer=CONFIG.BUFFER;
 const accel=this.grounded?CONFIG.ACCEL:CONFIG.AIR_ACCEL;if(input.left){this.vx-=accel;this.face=-1;}if(input.right){this.vx+=accel;this.face=1;}const cap=input.run?CONFIG.RUN_SPEED:CONFIG.MAX_SPEED;this.vx=Math.max(-cap,Math.min(cap,this.vx));if(!input.left&&!input.right)this.vx*=this.grounded?CONFIG.FRICTION:.985;
 if(this.buffer>0&&this.coyote>0){this.vy=CONFIG.JUMP;this.grounded=false;this.coyote=0;this.buffer=0;this.jumpHold=CONFIG.JUMP_HOLD_FRAMES;this.squash=.78;this.stretch=1.25;for(let i=0;i<5;i++)parts.push(new Particle(this.x+this.w/2,this.y+this.h,Math.random()*3-1.5,Math.random()*-2,18));}
 if(input.jump&&this.jumpHold>0&&this.vy<0){this.vy+=CONFIG.JUMP_HOLD;this.jumpHold--;}else if(!input.jump)this.jumpHold=0;
 this.vy=Math.min(CONFIG.MAX_FALL,this.vy+CONFIG.GRAVITY);this.x+=this.vx;this.y+=this.vy;this.squash+=(1-this.squash)*.18;this.stretch+=(1-this.stretch)*.18;if(this.invuln>0)this.invuln--;
 if(this.grounded&&Math.abs(this.vx)>2&&Math.random()<.2)parts.push(new Particle(this.x+this.w/2,this.y+this.h,Math.random()*2-1,-Math.random()*1.5,15));}
 draw(ctx,camera){const x=this.x-camera;if(this.invuln>0&&Math.floor(this.invuln/5)%2===0)return;ctx.save();ctx.translate(x+this.w/2,this.y+this.h);ctx.scale(this.stretch,this.squash);ctx.translate(-this.w/2,-this.h);
 ctx.fillStyle='#a96f43';ctx.beginPath();ctx.ellipse(21,19,21,14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#87502f';ctx.beginPath();ctx.arc(this.face===1?30:12,7,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c58b5d';ctx.fillRect(this.face===1?32:1,15,10,9);ctx.fillStyle='#251b15';ctx.fillRect(this.face===1?35:4,11,3,3);ctx.fillStyle='#69432e';ctx.fillRect(7,27,7,6);ctx.fillRect(27,27,7,6);ctx.restore();}
 hurt(){if(this.invuln>0)return false;this.lives--;this.invuln=CONFIG.INVULN;this.vx=-this.face*4;this.vy=-7;return true;}
}
class Platform{constructor(x,y,w,h,kind='soil'){Object.assign(this,{x,y,w,h,kind});}draw(ctx,c,p){const x=this.x-c;if(x+this.w<0||x>CONFIG.W)return;ctx.fillStyle=p.ground;ctx.fillRect(x,this.y,this.w,this.h);ctx.fillStyle=this.kind==='stone'?'#9b9b7b':p.top;ctx.fillRect(x,this.y,this.w,Math.min(12,this.h));}}
class Enemy{constructor(x,y,min,max,type='crab'){Object.assign(this,{x,y,w:34,h:25,min,max,type,dir:1,dead:false});}update(){this.x+=this.dir*(this.type==='bird'?1.6:1.25);if(this.x<this.min||this.x+this.w>this.max)this.dir*=-1;}draw(ctx,c){if(this.dead)return;ctx.save();ctx.translate(this.x-c,this.y);ctx.fillStyle=this.type==='bird'?'#e8d18a':'#46534a';ctx.beginPath();ctx.ellipse(17,14,17,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f7e9c6';ctx.fillRect(this.dir>0?23:7,7,4,4);ctx.restore();}}
class Fruit{constructor(x,y){Object.assign(this,{x,y,w:18,h:20,base:y,phase:Math.random()*6,collected:false});}update(){this.phase+=.07;this.y=this.base+Math.sin(this.phase)*4;}draw(ctx,c,p){if(this.collected)return;ctx.fillStyle=p.accent;ctx.beginPath();ctx.arc(this.x-c+9,this.y+10,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#315c35';ctx.fillRect(this.x-c+8,this.y,3,5);}}
class Particle{constructor(x,y,vx,vy,life){Object.assign(this,{x,y,vx,vy,life,max:life,size:2+Math.random()*4});}update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.08;this.life--;}draw(ctx,c){ctx.globalAlpha=Math.max(0,this.life/this.max);ctx.fillStyle='#eee0bd';ctx.fillRect(this.x-c,this.y,this.size,this.size);ctx.globalAlpha=1;}}
</script>
