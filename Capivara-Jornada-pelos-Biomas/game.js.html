 <script>
(()=>{
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),status=document.getElementById('status');let level,player,parts=[],camera=0,state='menu',levelIndex=0,score=0,sound=true,keys={left:false,right:false,jump:false,jumpPressed:false,run:false},last=0;
function loadLevel(i){levelIndex=Math.max(0,Math.min(17,i));level=makeLevel(levelIndex);player=new Player(level.start.x,level.start.y);player.score=score;parts=[];camera=0;state='playing';overlay.classList.add('hidden');status.textContent=level.biome+' · '+level.title;}
function start(){score=0;loadLevel(0);}function finish(){state='won';overlay.classList.remove('hidden');overlay.querySelector('.eyebrow').textContent='FASE CONCLUÍDA';overlay.querySelector('h1').innerHTML='Muito bem!<br><em>🦫</em>';overlay.querySelector('p').textContent=levelIndex===17?'Você concluiu os seis biomas do Brasil!':'Frutos coletados e natureza protegida. Próxima parada: '+BIOMES[Math.floor((levelIndex+1)/3)].name+'.';document.getElementById('playBtn').textContent=levelIndex===17?'Jogar novamente':'Próxima fase';document.getElementById('levelsBtn').textContent='Voltar ao início';}
function lose(){state='over';overlay.classList.remove('hidden');overlay.querySelector('.eyebrow').textContent='FIM DE JOGO';overlay.querySelector('h1').innerHTML='Vamos<br><em>tentar de novo?</em>';overlay.querySelector('p').textContent='A aventura continua. Seu melhor progresso fica salvo neste aparelho.';document.getElementById('playBtn').textContent='Tentar novamente';document.getElementById('levelsBtn').textContent='Voltar ao início';}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function update(){if(state!=='playing')return;player.update(keys,parts);const wasGrounded=player.grounded;player.grounded=false;
 for(const p of level.platforms){if(overlap(player,p)&&player.vy>=0&&player.y+player.h-player.vy<=p.y+8){player.y=p.y-player.h;player.vy=0;player.grounded=true;if(!wasGrounded){player.squash=1.2;player.stretch=.82;}}}
 if(player.y>CONFIG.H+100){if(player.hurt()){player.x=player.checkpointX;player.y=level.start.y;}if(player.lives<=0)lose();}
 for(const e of level.enemies){if(e.dead)continue;e.update();if(overlap(player,e)){if(player.vy>1&&player.y+player.h-player.vy<e.y+12){e.dead=true;player.vy=-8;player.score+=25;}else if(player.hurt()&&player.lives<=0)lose();}}
 for(const f of level.fruits){f.update();if(!f.collected&&overlap(player,f)){f.collected=true;player.score+=10;}}
 parts.forEach(p=>p.update());parts=parts.filter(p=>p.life>0);camera=Math.max(0,Math.min(level.width-CONFIG.W,camera+(player.x-CONFIG.W*.35-camera)*.09));keys.jumpPressed=false;
 if(level.fruits.every(f=>f.collected)){score=player.score;try{localStorage.setItem('capivaraProgress',JSON.stringify({unlocked:Math.max(levelIndex+2,Number(localStorage.getItem('capivaraUnlocked')||1)),score}));localStorage.setItem('capivaraUnlocked',String(Math.max(levelIndex+2,Number(localStorage.getItem('capivaraUnlocked')||1))));}catch(e){}finish();}}
function background(){const p=level.palette;const g=ctx.createLinearGradient(0,0,0,CONFIG.H);g.addColorStop(0,p.sky);g.addColorStop(1,'#e6d59c');ctx.fillStyle=g;ctx.fillRect(0,0,CONFIG.W,CONFIG.H);for(let i=0;i<8;i++){const x=((i*190-camera*.22)%(CONFIG.W+220)+CONFIG.W+220)%(CONFIG.W+220)-100;ctx.fillStyle=p.far;ctx.beginPath();ctx.moveTo(x,CONFIG.GROUND_Y);ctx.lineTo(x+90,210+(i%3)*35);ctx.lineTo(x+190,CONFIG.GROUND_Y);ctx.fill();}ctx.fillStyle=p.near;for(let i=0;i<12;i++){const x=((i*115-camera*.48)%(CONFIG.W+130)+CONFIG.W+130)%(CONFIG.W+130)-60;ctx.fillRect(x,CONFIG.GROUND_Y-90-(i%3)*15,12,90+(i%3)*15);ctx.beginPath();ctx.arc(x+6,CONFIG.GROUND_Y-90-(i%3)*15,35,0,Math.PI*2);ctx.fill();}}
function draw(){if(!level){ctx.fillStyle='#18392c';ctx.fillRect(0,0,CONFIG.W,CONFIG.H);return;}background();for(const p of level.platforms)p.draw(ctx,camera,level.palette);for(const f of level.fruits)f.draw(ctx,camera,level.palette);for(const e of level.enemies)e.draw(ctx,camera);for(const p of parts)p.draw(ctx,camera);player.draw(ctx,camera);UI.hud(ctx,player,level);if(state==='over')UI.message(ctx,'FIM DE JOGO','Toque em tentar novamente');}
function loop(t){const dt=Math.min(32,t-last||16);last=t;if(state==='playing')update();draw();requestAnimationFrame(loop);}
function key(e,on){const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' ','a','d','shift','w'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')keys.left=on;if(k==='arrowright'||k==='d')keys.right=on;if(k==='shift')keys.run=on;if(k==='arrowup'||k==='w'||k===' ') {if(on&&!keys.jump)keys.jumpPressed=true;keys.jump=on;}}
window.addEventListener('keydown',e=>key(e,true));window.addEventListener('keyup',e=>key(e,false));window.addEventListener('blur',()=>{keys={left:false,right:false,jump:false,jumpPressed:false,run:false};});
document.querySelectorAll('[data-control]').forEach(b=>{const k=b.dataset.control,down=e=>{e.preventDefault();if(k==='left')keys.left=true;else if(k==='right')keys.right=true;else if(k==='run')keys.run=true;else{if(!keys.jump)keys.jumpPressed=true;keys.jump=true;}},up=e=>{e.preventDefault();if(k==='left')keys.left=false;else if(k==='right')keys.right=false;else if(k==='run')keys.run=false;else keys.jump=false;};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);});
document.getElementById('playBtn').addEventListener('click',()=>{if(state==='won'&&levelIndex<17)loadLevel(levelIndex+1);else start();});document.getElementById('levelsBtn').addEventListener('click',()=>{const n=Number(prompt('Digite a fase de 1 a 18:','1'));if(Number.isInteger(n)&&n>=1&&n<=18){const unlocked=Number(localStorage.getItem('capivaraUnlocked')||1);if(n<=unlocked)loadLevel(n-1);else alert('Conclua as fases anteriores para desbloquear esta.');}else{overlay.querySelector('.eyebrow').textContent='AVENTURA BRASILEIRA';overlay.querySelector('h1').innerHTML='Capivara<br><em>nos Biomas</em>';overlay.querySelector('p').textContent='Explore o Brasil, colete frutos e proteja a natureza.';document.getElementById('playBtn').textContent='Começar aventura';document.getElementById('levelsBtn').textContent='Escolher fase';state='menu';}});
document.getElementById('soundBtn').addEventListener('click',e=>{sound=!sound;e.currentTarget.textContent=sound?'♫':'♪';});requestAnimationFrame(loop);
})();
</script>
